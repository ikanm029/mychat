<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grok Chat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans",sans-serif;background:#1c1c1e;color:#f2f2f7;height:100dvh;display:flex;flex-direction:column}
header{padding:14px 16px;background:#2c2c2e;border-bottom:1px solid #3a3a3c;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
header h1{font-size:1.15rem;font-weight:600;color:#fff}
header button{background:#3a3a3c;border:1px solid #48484a;color:#fff;padding:8px 12px;border-radius:10px;font-size:.85rem;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:12px 14px;border-radius:16px;line-height:1.55;white-space:pre-wrap;word-break:break-word;font-size:.95rem}
.user{align-self:flex-end;background:#0a84ff;color:#fff;border-bottom-right-radius:4px}
.assistant{align-self:flex-start;background:#2c2c2e;border:1px solid #3a3a3c;border-bottom-left-radius:4px}
.note{align-self:center;font-size:.85rem;color:#8e8e93;text-align:center;max-width:100%}
#inputArea{padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:#2c2c2e;border-top:1px solid #3a3a3c;display:flex;gap:10px;align-items:flex-end;flex-shrink:0}
#input{flex:1;background:#1c1c1e;border:1px solid #48484a;color:#f2f2f7;border-radius:14px;padding:12px 14px;font-size:16px;resize:none;min-height:48px;max-height:140px;line-height:1.4}
#send{background:#0a84ff;border:none;color:#fff;width:48px;height:48px;border-radius:14px;font-size:1.25rem;cursor:pointer;flex-shrink:0}
#send:disabled{opacity:.45}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;align-items:center;justify-content:center;padding:16px}
#modal.open{display:flex}
.modal-content{background:#2c2c2e;border-radius:16px;padding:20px;width:100%;max-width:440px;max-height:90dvh;overflow-y:auto;border:1px solid #3a3a3c}
.modal-content h2{margin-bottom:8px;font-size:1.15rem;color:#fff}
label{display:block;font-size:.8rem;color:#8e8e93;margin:14px 0 6px}
input,select,textarea{width:100%;background:#1c1c1e;border:1px solid #48484a;color:#f2f2f7;border-radius:10px;padding:11px 12px;font-size:.95rem}
textarea{min-height:110px;resize:vertical}
.btn-row{display:flex;gap:10px;margin-top:20px}
.btn-row button{flex:1;padding:12px;border-radius:12px;border:none;font-size:.95rem;cursor:pointer}
#saveSettings{background:#0a84ff;color:#fff}
#closeSettings{background:#3a3a3c;color:#fff}
</style>
</head>
<body>
<header>
  <h1>Grok Chat</h1>
  <div style="display:flex;gap:8px">
    <button type="button" id="clearBtn">履歴削除</button>
    <button type="button" id="settingsBtn">設定</button>
  </div>
</header>
<div id="chat">
  <div class="msg note">右上の「設定」から APIキー を入れてください。<br>下の入力欄に文字を打って送信できます。</div>
</div>
<div id="inputArea">
  <textarea id="input" placeholder="メッセージを入力..." rows="1"></textarea>
  <button type="button" id="send">➤</button>
</div>
<div id="modal">
  <div class="modal-content">
    <h2>設定</h2>
    <label>API Key（xAI）</label>
    <input type="password" id="apiKey" placeholder="xai-..." autocomplete="off">
    <label>モデル</label>
    <select id="model">
      <option value="grok-4.3">grok-4.3</option>
      <option value="grok-4.5">grok-4.5</option>
      <option value="grok-4">grok-4</option>
    </select>
    <label>システムプロンプト（カスタム指示）</label>
    <textarea id="systemPrompt" placeholder="固定のカスタムプロンプトをここに"></textarea>
    <div class="btn-row">
      <button type="button" id="closeSettings">閉じる</button>
      <button type="button" id="saveSettings">保存</button>
    </div>
  </div>
</div>
<script>
const chatEl=document.getElementById('chat');
const inputEl=document.getElementById('input');
const sendBtn=document.getElementById('send');
const modal=document.getElementById('modal');
const apiKeyInput=document.getElementById('apiKey');
const modelSelect=document.getElementById('model');
const systemPromptEl=document.getElementById('systemPrompt');
let messages=[];

function loadSettings(){
  apiKeyInput.value=localStorage.getItem('grok_api_key')||'';
  modelSelect.value=localStorage.getItem('grok_model')||'grok-4.3';
  systemPromptEl.value=localStorage.getItem('grok_system')||'You are a helpful assistant. Respond in Japanese unless asked otherwise.';
}
loadSettings();

document.getElementById('saveSettings').onclick=()=>{
  localStorage.setItem('grok_api_key',apiKeyInput.value.trim());
  localStorage.setItem('grok_model',modelSelect.value);
  localStorage.setItem('grok_system',systemPromptEl.value);
  modal.classList.remove('open');
  addNote('設定を保存しました');
};
document.getElementById('closeSettings').onclick=()=>modal.classList.remove('open');
document.getElementById('settingsBtn').onclick=()=>modal.classList.add('open');
document.getElementById('clearBtn').onclick=()=>{
  if(confirm('チャット履歴を消しますか？')){
    messages=[];
    chatEl.innerHTML='';
    addNote('履歴を削除しました');
  }
};

function addNote(t){
  const d=document.createElement('div');
  d.className='msg note';
  d.innerHTML=t;
  chatEl.appendChild(d);
  chatEl.scrollTop=chatEl.scrollHeight;
}
function addMessage(role,content){
  const d=document.createElement('div');
  d.className='msg '+role;
  d.textContent=content;
  chatEl.appendChild(d);
  chatEl.scrollTop=chatEl.scrollHeight;
}

async function sendMessage(){
  const text=inputEl.value.trim();
  if(!text) return;
  const apiKey=localStorage.getItem('grok_api_key');
  if(!apiKey){
    alert('先に「設定」でAPIキーを入れてください');
    modal.classList.add('open');
    return;
  }
  inputEl.value='';
  inputEl.style.height='auto';
  sendBtn.disabled=true;
  addMessage('user',text);
  messages.push({role:'user',content:text});
  const thinking=document.createElement('div');
  thinking.className='msg assistant';
  thinking.textContent='…';
  chatEl.appendChild(thinking);
  chatEl.scrollTop=chatEl.scrollHeight;
  try{
    const system=localStorage.getItem('grok_system')||'';
    const model=localStorage.getItem('grok_model')||'grok-4.3';
    const res=await fetch('https://api.x.ai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
      body:JSON.stringify({
        model:model,
        messages:[{role:'system',content:system},...messages],
        temperature:0.9
      })
    });
    if(!res.ok){
      const errText=await res.text();
      throw new Error(res.status+' '+errText);
    }
    const data=await res.json();
    const reply=data.choices?.[0]?.message?.content||'(空の応答)';
    thinking.textContent=reply;
    messages.push({role:'assistant',content:reply});
  }catch(e){
    thinking.textContent='エラー: '+e.message;
  }finally{
    sendBtn.disabled=false;
    chatEl.scrollTop=chatEl.scrollHeight;
  }
}

sendBtn.onclick=sendMessage;
inputEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){
    e.preventDefault();
    sendMessage();
  }
});
inputEl.addEventListener('input',()=>{
  inputEl.style.height='auto';
  inputEl.style.height=Math.min(inputEl.scrollHeight,140)+'px';
});
</script>
</body>
</html>
