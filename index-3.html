<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grok Chat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans",sans-serif;background:#1c1c1e;color:#f2f2f7;height:100dvh;display:flex;flex-direction:column}
header{padding:14px 16px;background:#2c2c2e;border-bottom:1px solid #3a3a3c;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
header h1{font-size:1.15rem;font-weight:600;color:#fff}
header button{background:#3a3a3c;border:1px solid #48484a;color:#fff;padding:8px 12px;border-radius:10px;font-size:.85rem;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:12px 14px;border-radius:16px;line-height:1.55;white-space:pre-wrap;word-break:break-word;font-size:.95rem}
.user{align-self:flex-end;background:#0a84ff;color:#fff;border-bottom-right-radius:4px}
.assistant{align-self:flex-start;background:#2c2c2e;border:1px solid #3a3a3c;border-bottom-left-radius:4px}
.note{align-self:center;font-size:.85rem;color:#8e8e93;text-align:center;max-width:100%}
#inputArea{padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:#2c2c2e;border-top:1px solid #3a3a3c;display:flex;gap:10px;align-items:flex-end;flex-shrink:0}
#input{flex:1;background:#1c1c1e;border:1px solid #48484a;color:#f2f2f7;border-radius:14px;padding:12px 14px;font-size:16px;resize:none;min-height:48px;max-height:140px;line-height:1.4}
#send{background:#0a84ff;border:none;color:#fff;width:48px;height:48px;border-radius:14px;font-size:1.25rem;cursor:pointer;flex-shrink:0}
#send:disabled{opacity:.45}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;align-items:center;justify-content:center;padding:16px}
#modal.open{display:flex}
.modal-content{background:#2c2c2e;border-radius:16px;padding:20px;width:100%;max-width:440px;max-height:90dvh;overflow-y:auto;border:1px solid #3a3a3c}
.modal-content h2{margin-bottom:8px;font-size:1.15rem;color:#fff}
label{display:block;font-size:.8rem;color:#8e8e93;margin:14px 0 6px}
input,select,textarea{width:100%;background:#1c1c1e;border:1px solid #48484a;color:#f2f2f7;border-radius:10px;padding:11px 12px;font-size:.95rem}
textarea{min-height:110px;resize:vertical}
.btn-row{display:flex;gap:10px;margin-top:20px}
.btn-row button{flex:1;padding:12px;border-radius:12px;border:none;font-size:.95rem;cursor:pointer}
#saveSettings{background:#0a84ff;color:#fff}
#closeSettings,#loadModels{background:#3a3a3c;color:#fff;border:1px solid #48484a}
#loadModels{width:100%;margin-top:8px;padding:11px;border-radius:10px;cursor:pointer}
#info{padding:8px 16px 10px;background:#242426;border-bottom:1px solid #3a3a3c;flex-shrink:0;display:flex;flex-direction:column;gap:3px}
#info .line{font-size:.82rem;line-height:1.45;color:#d1d1d6}
#info .muted{color:#8e8e93}
</style>
</head>
<body>
<header>
  <h1>Grok Chat</h1>
  <div style="display:flex;gap:8px">
    <button type="button" id="clearBtn">履歴削除</button>
    <button type="button" id="settingsBtn">設定</button>
  </div>
</header>
<div id="info">
  <div class="line" id="infoModel">モデル: まだ選んでいません</div>
  <div class="line muted" id="infoTrait">設定を開くと、今使えるモデルの特徴をここに出します。</div>
  <div class="line muted" id="infoUsage">この画面の使用: まだ送信していません</div>
</div>
<div id="chat">
  <div class="msg note">右上の「設定」から APIキー を入れてください。<br>モデルは設定を開くと、今使える名前を読みます。</div>
</div>
<div id="inputArea">
  <textarea id="input" placeholder="メッセージを入力..." rows="1"></textarea>
  <button type="button" id="send">➤</button>
</div>
<div id="modal">
  <div class="modal-content">
    <h2>設定</h2>
    <label>API Key（xAI）</label>
    <input type="password" id="apiKey" placeholder="xai-..." autocomplete="off">
    <label>モデル</label>
    <select id="model">
      <option value="grok-4.3">grok-4.3（まだ読んでいない）</option>
    </select>
    <button type="button" id="loadModels">今使えるモデルを読む</button>
    <p id="modelHint" class="hint">画像用と音声用は、この会話の送信先では失敗しやすいので除いています。</p>
    <label>システムプロンプト（カスタム指示）</label>
    <textarea id="systemPrompt" placeholder="固定のカスタムプロンプトをここに"></textarea>
    <div class="btn-row">
      <button type="button" id="closeSettings">閉じる</button>
      <button type="button" id="saveSettings">保存</button>
    </div>
  </div>
</div>
<script>
const chatEl=document.getElementById('chat');
const inputEl=document.getElementById('input');
const sendBtn=document.getElementById('send');
const modal=document.getElementById('modal');
const apiKeyInput=document.getElementById('apiKey');
const modelSelect=document.getElementById('model');
const systemPromptEl=document.getElementById('systemPrompt');
const modelHint=document.getElementById('modelHint');
const infoModel=document.getElementById('infoModel');
const infoTrait=document.getElementById('infoTrait');
const infoUsage=document.getElementById('infoUsage');
let messages=[];
let modelCatalog=[];
let sessionPrompt=0;
let sessionCompletion=0;
let sessionCost=0;

function loadSettings(){
  apiKeyInput.value=localStorage.getItem('grok_api_key')||'';
  systemPromptEl.value=localStorage.getItem('grok_system')||'You are a helpful assistant. Respond in Japanese unless asked otherwise.';
  const saved=localStorage.getItem('grok_model')||'grok-4.3';
  ensureOption(saved, saved+'（保存済み）');
  modelSelect.value=saved;
}
loadSettings();

function ensureOption(value, label){
  if(!value) return;
  if(![...modelSelect.options].some(o=>o.value===value)){
    const opt=document.createElement('option');
    opt.value=value;
    opt.textContent=label||value;
    modelSelect.appendChild(opt);
  }
}

function isChatModel(m){
  const id=m.id||'';
  if(id.startsWith('grok-imagine')||id.startsWith('grok-voice')) return false;
  if(m.image_price && !m.completion_text_token_price) return false;
  return true;
}

function dollars(centsPer100Million){
  if(typeof centsPer100Million!=='number') return '';
  return (centsPer100Million/10000).toFixed(2);
}

function traitFor(id){
  if(id==='grok-4.7') return '今の会話とコードの先端。文脈は50万。考える量を変えられる。単価は高め。';
  if(id==='grok-4.6'||id==='grok-4.5') return '一つ前の世代。文脈は50万。単価は4.7と同じ帯。';
  if(id==='grok-4.3') return '長い会話の受け皿。文脈は100万。4.7より単価が低い。';
  if(id==='grok-4.20-0309-reasoning') return '考えながら返す方。文脈は100万。単価は4.3と同じ帯。';
  if(id==='grok-4.20-0309-non-reasoning') return '考えずに返す方。待ち時間が短くなりやすい。文脈は100万。';
  if(id==='grok-build-0.1') return 'コード作業向け。文脈は25.6万。単価は低め。';
  if(id==='grok-4.20-multi-agent-0309') return '複数の役を分ける用途。一対一の会話には、まず不要。';
  if(id==='grok-4') return '古い名前。今は別のモデルへ寄せられることがある。';
  return '会話用として一覧に入っていた名前です。画像用と音声用は除いています。';
}

function currentModel(){
  return modelCatalog.find(m=>m.id===(modelSelect.value||localStorage.getItem('grok_model')))||null;
}

function renderInfo(last){
  const id=modelSelect.value||localStorage.getItem('grok_model')||'未選択';
  const m=currentModel();
  const input=m?dollars(m.prompt_text_token_price):'';
  const output=m?dollars(m.completion_text_token_price):'';
  const ctx=m&&m.context_length?m.context_length.toLocaleString()+'トークン':'一覧を読むと出ます';
  const price=input&&output?'入力 '+input+' ドル / 出力 '+output+' ドル（100万トークンあたり）':'単価は一覧を読むと出ます';
  infoModel.textContent='モデル: '+id+'　文脈 '+ctx+'　'+price;
  infoTrait.textContent=traitFor(id);
  const lastText=last?('直前は入力 '+last.prompt+'、出力 '+last.completion+'。'):'';
  infoUsage.textContent='この画面の使用: 入力 '+sessionPrompt.toLocaleString()+'、出力 '+sessionCompletion.toLocaleString()+'、合計 '+(sessionPrompt+sessionCompletion).toLocaleString()+'。目安 '+sessionCost.toFixed(4)+' ドル。'+lastText;
}
renderInfo();

async function loadModels(){
  const apiKey=(apiKeyInput.value||localStorage.getItem('grok_api_key')||'').trim();
  if(!apiKey){
    modelHint.textContent='先にAPIキーを入れてください。';
    return;
  }
  modelHint.textContent='読んでいます。';
  const res=await fetch('https://api.x.ai/v1/models',{
    headers:{Authorization:'Bearer '+apiKey}
  });
  const text=await res.text();
  if(!res.ok){
    modelHint.textContent='読めませんでした。状態 '+res.status+'。キーを確認してください。';
    return;
  }
  const data=JSON.parse(text);
  const list=(Array.isArray(data.data)?data.data:[]).filter(isChatModel);
  list.sort((a,b)=>String(a.id).localeCompare(String(b.id)));
  modelCatalog=list;
  const saved=modelSelect.value||localStorage.getItem('grok_model')||'';
  modelSelect.innerHTML='';
  for(const m of list){
    const opt=document.createElement('option');
    opt.value=m.id;
    const input=dollars(m.prompt_text_token_price);
    const output=dollars(m.completion_text_token_price);
    const price=input&&output?'（入'+input+' / 出'+output+'）':'';
    opt.textContent=m.id+price;
    modelSelect.appendChild(opt);
  }
  if(saved && [...modelSelect.options].some(o=>o.value===saved)) modelSelect.value=saved;
  else if(saved) ensureOption(saved, saved+'（今回の一覧にはない）');
  modelHint.textContent=list.length+' 件を出しました。上の帯に、選んだモデルの特徴と単価を出します。';
  renderInfo();
}

document.getElementById('saveSettings').onclick=()=>{
  localStorage.setItem('grok_api_key',apiKeyInput.value.trim());
  localStorage.setItem('grok_model',modelSelect.value);
  localStorage.setItem('grok_system',systemPromptEl.value);
  modal.classList.remove('open');
  renderInfo();
  addNote('設定を保存しました。送るモデルは '+modelSelect.value+' です。');
};
document.getElementById('closeSettings').onclick=()=>modal.classList.remove('open');
document.getElementById('settingsBtn').onclick=()=>{
  modal.classList.add('open');
  if(apiKeyInput.value.trim()) loadModels().catch(e=>{ modelHint.textContent=String(e); });
};
document.getElementById('loadModels').onclick=()=>loadModels().catch(e=>{ modelHint.textContent=String(e); });
document.getElementById('clearBtn').onclick=()=>{
  if(confirm('チャット履歴を消しますか？')){
    messages=[];
    chatEl.innerHTML='';
    addNote('履歴を削除しました');
  }
};

function addNote(t){
  const d=document.createElement('div');
  d.className='msg note';
  d.textContent=t;
  chatEl.appendChild(d);
  chatEl.scrollTop=chatEl.scrollHeight;
}
function addMessage(role,content){
  const d=document.createElement('div');
  d.className='msg '+role;
  d.textContent=content;
  chatEl.appendChild(d);
  chatEl.scrollTop=chatEl.scrollHeight;
}

async function sendMessage(){
  const text=inputEl.value.trim();
  if(!text) return;
  const apiKey=localStorage.getItem('grok_api_key');
  if(!apiKey){
    alert('先に「設定」でAPIキーを入れてください');
    modal.classList.add('open');
    return;
  }
  inputEl.value='';
  inputEl.style.height='auto';
  sendBtn.disabled=true;
  addMessage('user',text);
  messages.push({role:'user',content:text});
  const thinking=document.createElement('div');
  thinking.className='msg assistant';
  thinking.textContent='…';
  chatEl.appendChild(thinking);
  chatEl.scrollTop=chatEl.scrollHeight;
  try{
    const system=localStorage.getItem('grok_system')||'';
    const model=localStorage.getItem('grok_model')||modelSelect.value||'grok-4.3';
    const res=await fetch('https://api.x.ai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
      body:JSON.stringify({
        model:model,
        messages:[{role:'system',content:system},...messages],
        temperature:0.9
      })
    });
    if(!res.ok){
      const errText=await res.text();
      throw new Error(res.status+' '+errText);
    }
    const data=await res.json();
    const reply=data.choices?.[0]?.message?.content||'(空の応答)';
    const usage=data.usage||{};
    const prompt=usage.prompt_tokens||0;
    const completion=usage.completion_tokens||0;
    sessionPrompt+=prompt;
    sessionCompletion+=completion;
    const m=currentModel();
    const inRate=m?Number(dollars(m.prompt_text_token_price)):0;
    const outRate=m?Number(dollars(m.completion_text_token_price)):0;
    sessionCost+=prompt/1e6*inRate+completion/1e6*outRate;
    const returned=data.model&&data.model!==model?'\n\n（返ってきたモデル名: '+data.model+'）':'';
    const used='\n\n（この送信: 入力 '+prompt+'、出力 '+completion+'）';
    thinking.textContent=reply+returned+used;
    messages.push({role:'assistant',content:reply});
    renderInfo({prompt,completion});
  }catch(e){
    thinking.textContent='エラー: '+e.message;
  }finally{
    sendBtn.disabled=false;
    chatEl.scrollTop=chatEl.scrollHeight;
  }
}

sendBtn.onclick=sendMessage;
inputEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){
    e.preventDefault();
    sendMessage();
  }
});
inputEl.addEventListener('input',()=>{
  inputEl.style.height='auto';
  inputEl.style.height=Math.min(inputEl.scrollHeight,140)+'px';
});
</script>
</body>
</html>
